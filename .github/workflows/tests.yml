name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is what macOS ships as /usr/bin/python3; setup-python has no
          # 3.9 build for Ubuntu 26.04 (ubuntu-latest), so this row stays on 24.04
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          # viewing only on Windows; real screen capture is not exercised here
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Linux input goes through X11: run under a virtual X server so the XTest
      # code is exercised against a real one (the test must not be skipped here)
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libxtst6
          SWITCHDISPLAY_REQUIRE_X11=1 xvfb-run -a python -m unittest discover -s tests -v
      - if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

  viewer-es5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: tools/check_viewer_es5.sh
